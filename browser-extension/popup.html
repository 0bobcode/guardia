<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 16px;
    background: #090c14;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  p.sub {
    font-size: 12px;
    color: #94a3b8;
    margin: 0 0 14px;
  }
  p.hint {
    font-size: 11px;
    color: #64748b;
    margin: 0 0 10px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-size: 11px;
    color: #94a3b8;
    margin: 0 0 4px;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #64748b;
  }
  .dot.on {
    background: #2dd4bf;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    background: #171d33;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    color: #f1f5f9;
    font-size: 13px;
    padding: 10px;
    margin-bottom: 10px;
  }
  input.code {
    font-size: 16px;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
  }
  button {
    width: 100%;
    background: #2dd4bf;
    color: #04211d;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  button.outline {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #f1f5f9;
    margin-top: 8px;
  }
  .error {
    color: #f87171;
    font-size: 12px;
    margin: 0 0 10px;
  }
</style>
</head>
<body>
  <h1>Guardia Companion</h1>
  <p class="sub" id="subtitle">Not paired — enter the code from TrustEd</p>
  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText" style="font-size: 12px; color: #94a3b8;">Checking…</span>
  </div>

  <div id="pairForm">
    <input id="pairCode" class="code" placeholder="Pairing code" maxlength="8" />
    <label for="pairPassword">Unpair password (optional)</label>
    <input id="pairPassword" type="password" placeholder="Set a password to protect unpairing" />
    <p class="hint">
      If set, this password is required to unpair from this popup. It does not stop the extension
      from being removed via chrome://extensions — Chrome doesn't allow any extension to block that.
    </p>
    <p class="error" id="pairError" style="display: none;"></p>
    <button id="pairButton">Pair device</button>
  </div>

  <div id="unpairSection" style="display: none;">
    <div id="unpairPrompt" style="display: none;">
      <label for="unpairPassword">Enter unpair password</label>
      <input id="unpairPassword" type="password" placeholder="Password" />
      <p class="error" id="unpairError" style="display: none;"></p>
    </div>
    <button id="unpairButton" class="outline">Unpair this browser</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
